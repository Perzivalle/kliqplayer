name: lecteur
description: "Lecteur de musique local pour Linux, en forme d'iPod à molette."
publish_to: 'none'

version: 0.7.0+14

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  audio_metadata_reader: ^1.8.1
  window_manager: ^0.6.0
  # Écrans (taille, position) : la fenêtre s'étend jusqu'au bord de l'écran.
  nativeapi: ^0.5.5
  flutter_soloud: ^5.2.3
  # Horloge que les tests peuvent faire avancer (volume, rétroéclairage).
  clock: ^1.1.2
  http: ^1.6.0
  url_launcher: ^6.3.3
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Noto Sans (SIL Open Font License, assets/fonts/OFL.txt) fournie avec
  # l'appli : elle n'est pas installée partout (Windows, macOS).
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    # Police des écrans des 1re et 2e générations (recréation de Chicago).
    - family: ChicagoFLF
      fonts:
        - asset: assets/fonts/ChicagoFLF.ttf
