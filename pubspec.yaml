name: lecteur
description: "Lecteur de musique local pour Linux, en forme d'iPod à molette."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  audio_metadata_reader: ^1.8.1
  window_manager: ^0.6.0
  flutter_soloud: ^5.2.3
  # Horloge que les tests peuvent faire avancer (volume, rétroéclairage).
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
