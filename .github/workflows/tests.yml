# À chaque push : l'analyse statique et les tests (menus, tiroir, lecteur,
# Spotify simulé, captures de référence).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Même version de Flutter que pour les versions publiées.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      # La bibliothèque de fenêtres et le son se compilent pour les tests :
      # il leur faut GTK 3, X11, Xi et ALSA.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev libasound2-dev pkg-config

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test
