# Les trois versions, compilées chacune sur son système chez GitHub, seulement
# quand une release est publiée : les archives y sont ajoutées sous des noms
# fixes (le site pointe sur .../releases/latest/download/<nom>). Lancement à la
# main possible (onglet Actions) : les archives sont alors des artefacts.
# « latest » ignore les pré-releases : publier les versions comme releases normales.
name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  linux:
    # Ubuntu 22.04 : glibc 2.35, l'archive tourne aussi sur les distributions
    # plus anciennes que celle du développeur.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev libasound2-dev libmpv-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Archive
        run: |
          mv build/linux/x64/release/bundle KliqPlayer
          # ./install.sh : raccourci dans le menu, icône, et vérifie libmpv.
          cp linux/packaging/install.sh assets/icon/kliqplayer.svg KliqPlayer/
          chmod +x KliqPlayer/install.sh
          tar -czf KliqPlayer-linux-x64.tar.gz KliqPlayer
      - uses: actions/upload-artifact@v4
        with:
          name: KliqPlayer-linux-x64
          path: KliqPlayer-linux-x64.tar.gz
      - name: Ajouter à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" KliqPlayer-linux-x64.tar.gz --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Archive
        shell: pwsh
        run: |
          $name = "KliqPlayer"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item -Recurse build\windows\x64\runner\Release\* $name
          # Le runtime Visual C++ voyage avec l'appli (redistribution permise) :
          # un Windows tout neuf ne l'a pas toujours.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $name
          }
          Compress-Archive -Path $name -DestinationPath KliqPlayer-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KliqPlayer-windows-x64
          path: KliqPlayer-windows-x64.zip
      - name: Ajouter à la release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME KliqPlayer-windows-x64.zip --clobber

  macos:
    # Non signée : au premier lancement, clic droit › Ouvrir.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Archive
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/KliqPlayer.app KliqPlayer-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KliqPlayer-macos
          path: KliqPlayer-macos.zip
      - name: Ajouter à la release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" KliqPlayer-macos.zip --clobber
